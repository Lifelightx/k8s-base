stages:
  - test
  - build
  - deploy

variables:
  # This tag will be unique per commit
  FRONTEND_IMAGE: k8s-todo-frontend:$CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE: k8s-todo-backend:$CI_COMMIT_SHORT_SHA
  AUTH_IMAGE: k8s-todo-auth:$CI_COMMIT_SHORT_SHA
  GATEWAY_IMAGE: k8s-todo-gateway:$CI_COMMIT_SHORT_SHA
  LLM_IMAGE: k8s-todo-llm:$CI_COMMIT_SHORT_SHA

test-backend:
  stage: test
  image: node:22-alpine
  script:
    - echo "Running Backend unit tests..."
    - cd backend
    - npm install
    - npm run test
  only:
    changes:
      - backend/**/*

build-frontend:
  stage: build
  image: docker:latest
  script:
    - echo "Building Frontend Image..."
    - cd frontend
    - docker build -t $FRONTEND_IMAGE .
    # The runner has access to the host docker socket, so it can load the image directly into Minikube's daemon!
    - echo "Loading image into Minikube..."
    - docker save $FRONTEND_IMAGE | docker exec -i minikube docker load
    - echo "Cleaning up dangling images to save space..."
    - docker exec -i minikube docker image prune -f
  only:
    changes:
      - frontend/**/*

deploy-frontend:
  stage: deploy
  image: docker:latest
  script:
    - echo "Deploying Frontend to Kubernetes..."
    # We need to tell kubectl to use the new image tag
    - docker exec minikube sh -c "/var/lib/minikube/binaries/*/kubectl --kubeconfig /var/lib/minikube/kubeconfig set image deployment/todo-frontend frontend=$FRONTEND_IMAGE"
  only:
    changes:
      - frontend/**/*

build-backend:
  stage: build
  image: docker:latest
  script:
    - echo "Building Backend Image..."
    - cd backend
    - docker build -t $BACKEND_IMAGE .
    - echo "Loading image into Minikube..."
    - docker save $BACKEND_IMAGE | docker exec -i minikube docker load
    - echo "Cleaning up dangling images to save space..."
    - docker exec -i minikube docker image prune -f
  only:
    changes:
      - backend/**/*

deploy-backend:
  stage: deploy
  image: docker:latest
  script:
    - echo "Deploying Backend to Kubernetes..."
    - docker exec minikube sh -c "/var/lib/minikube/binaries/*/kubectl --kubeconfig /var/lib/minikube/kubeconfig set image deployment/todo-backend backend=$BACKEND_IMAGE"
  only:
    changes:
      - backend/**/*

