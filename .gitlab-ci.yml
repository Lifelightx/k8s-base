smoke-test-all:
  stage: smoke-test
  image: 
    name: curlimages/curl:latest
    pull_policy: if-not-present
  script:
    - echo "Testing if all services are live.."
    # Maps todo.app.com to the Minikube IP inside the curl container
    - curl -f --resolve todo.app.com:80:192.168.49.2 http://todo.app.com/api/health || exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
      - backend/**/*
      - auth/**/*
      - gateway/**/*
      - llm/**/*