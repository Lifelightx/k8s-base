stages:
  - lint
  - security
  - test
  - build
  - deploy
  - smoke-test

variables:
  FRONTEND_IMAGE: k8s-todo-frontend:$CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE: k8s-todo-backend:$CI_COMMIT_SHORT_SHA
  AUTH_IMAGE: k8s-todo-auth:$CI_COMMIT_SHORT_SHA
  GATEWAY_IMAGE: k8s-todo-gateway:$CI_COMMIT_SHORT_SHA
  LLM_IMAGE: k8s-todo-llm:$CI_COMMIT_SHORT_SHA
  HELM_KUBECONFIG: /var/lib/minikube/kubeconfig

# ── Lint ──────────────────────────────────────────────
lint-backend:
  stage: lint
  image: node:22-alpine
  script:
    - cd backend
    - npm install
    - npm run lint
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

# ── Security ──────────────────────────────────────────
security-audit-backend:
  stage: security
  image: node:22-alpine
  script:
    - cd backend
    - npm audit --audit-level=critical
  allow_failure: true
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

# ── Test ──────────────────────────────────────────────
test-backend:
  stage: test
  image: node:22-alpine
  script:
    - echo "Running Backend unit tests..."
    - cd backend
    - npm install
    - npm run test
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

# ── Build ─────────────────────────────────────────────
build-frontend:
  stage: build
  image: docker:latest
  script:
    - echo "Building Frontend Image..."
    - cd frontend
    - docker build -t $FRONTEND_IMAGE .
    - echo "Loading image into Minikube..."
    - docker save $FRONTEND_IMAGE | docker exec -i minikube docker load
    - docker exec -i minikube docker image prune -f
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

build-backend:
  stage: build
  image: docker:latest
  script:
    - echo "Building Backend Image..."
    - cd backend
    - docker build -t $BACKEND_IMAGE .
    - echo "Loading image into Minikube..."
    - docker save $BACKEND_IMAGE | docker exec -i minikube docker load
    - docker exec -i minikube docker image prune -f
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

build-auth:
  stage: build
  image: docker:latest
  script:
    - echo "Building Auth Image..."
    - cd auth
    - docker build -t $AUTH_IMAGE .
    - echo "Loading image into minikube..."
    - docker save $AUTH_IMAGE | docker exec -i minikube docker load
    - docker exec -i minikube docker image prune -f
  rules:
    - changes:
        - auth/**/*
        - .gitlab-ci.yml

build-gateway:
  stage: build
  image: docker:latest
  script:
    - echo "Building Gateway Image..."
    - cd gateway
    - docker build -t $GATEWAY_IMAGE .
    - echo "Loading image into Minikube..."
    - docker save $GATEWAY_IMAGE | docker exec -i minikube docker load
    - docker exec -i minikube docker image prune -f
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml

build-llm:
  stage: build
  image: docker:latest
  script:
    - echo "Building LLM Image..."
    - cd llm
    - docker build -t $LLM_IMAGE .
    - echo "Loading image into Minikube..."
    - docker save $LLM_IMAGE | docker exec -i minikube docker load
    - docker exec -i minikube docker image prune -f
  rules:
    - changes:
        - llm/**/*
        - .gitlab-ci.yml

# ── Deploy (per-service) ──────────────────────────────
# Uses --reuse-values so only the changed service's image tag is updated.
# The Helm chart must already be installed once (first deploy uses todo-app chart).

.helm_setup: &helm_setup
  - apk add --no-cache curl tar
  - curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v3.13.0-linux-amd64.tar.gz
  - tar -zxvf helm.tar.gz
  - docker cp linux-amd64/helm minikube:/usr/local/bin/helm

deploy-frontend:
  stage: deploy
  image: docker:latest
  needs: [build-frontend]
  script:
    - *helm_setup
    - echo "Deploying frontend only..."
    - docker exec minikube sh -c "/usr/local/bin/helm upgrade k8s-todo /todo-app
      --kubeconfig $HELM_KUBECONFIG --reuse-values
      --set frontend.image.tag=$CI_COMMIT_SHORT_SHA"
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

deploy-backend:
  stage: deploy
  image: docker:latest
  needs: [build-backend]
  script:
    - *helm_setup
    - echo "Deploying backend only..."
    - docker exec minikube sh -c "/usr/local/bin/helm upgrade k8s-todo /todo-app
      --kubeconfig $HELM_KUBECONFIG --reuse-values
      --set backend.image.tag=$CI_COMMIT_SHORT_SHA"
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

deploy-auth:
  stage: deploy
  image: docker:latest
  needs: [build-auth]
  script:
    - *helm_setup
    - echo "Deploying auth only..."
    - docker exec minikube sh -c "/usr/local/bin/helm upgrade k8s-todo /todo-app
      --kubeconfig $HELM_KUBECONFIG --reuse-values
      --set auth.image.tag=$CI_COMMIT_SHORT_SHA"
  rules:
    - changes:
        - auth/**/*
        - .gitlab-ci.yml

deploy-gateway:
  stage: deploy
  image: docker:latest
  needs: [build-gateway]
  script:
    - *helm_setup
    - echo "Deploying gateway only..."
    - docker exec minikube sh -c "/usr/local/bin/helm upgrade k8s-todo /todo-app
      --kubeconfig $HELM_KUBECONFIG --reuse-values
      --set gateway.image.tag=$CI_COMMIT_SHORT_SHA"
  rules:
    - changes:
        - gateway/**/*
        - .gitlab-ci.yml

deploy-llm:
  stage: deploy
  image: docker:latest
  needs: [build-llm]
  script:
    - *helm_setup
    - echo "Deploying llm only..."
    - docker exec minikube sh -c "/usr/local/bin/helm upgrade k8s-todo /todo-app
      --kubeconfig $HELM_KUBECONFIG --reuse-values
      --set llm.image.tag=$CI_COMMIT_SHORT_SHA"
  rules:
    - changes:
        - llm/**/*
        - .gitlab-ci.yml

# ── Smoke Test ────────────────────────────────────────
smoke-test-all:
  stage: smoke-test
  image: docker:latest
  script:
    - echo "Testing if all services are live..."
    - 'docker exec minikube curl -f -H "Host: todo.app.com" http://localhost/api/health || exit 1'
