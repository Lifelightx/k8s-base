services:
  mongo:
    image: mongo:8
    container_name: todo-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-net
  
  llm:
    build: 
      context: ./llm
      dockerfile: Dockerfile
    container_name: todo-llm
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=gemma4:31b-cloud
      - PORT=5003
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    networks:
      - todo-net
    
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: todo-gateway
    restart: unless-stopped
    environment:
       AUTH_SERVICE_URL : http://auth:5002
       BACKEND_SERVICE_URL : http://backend:5001
       LLM_SERVICE_URL : http://llm:5003
       ALLOW_ORIGIN : http://locahost:3000
       PORT : 5000
    networks:
      - todo-net
    
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: todo-auth
    restart: unless-stopped
    environment:
      MONGO_URI : mongodb://mongo:27017/todoapp
      JWT_SECRETE : hello-234567890-!@#4567
      PORT: 5002
    networks:
      - todo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/todoapp
      PORT: 5001
      LLM_SERVICE_URL: http://llm:5003
      JWT_SECRETE: hello-234567890-!@#4567
    depends_on:
      - mongo
      - llm
    networks:
      - todo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - todo-net

volumes:
  mongo-data:

networks:
  todo-net:
    driver: bridge
