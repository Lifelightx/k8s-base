apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-backend

  template:
    metadata:
      labels:
        app: todo-backend

    spec:
      containers:
        - name: backend 
          image: k8s-todo-backend:v6
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5001
          env: 
            - name: PORT
              value: "5001"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/todoapp"
            - name: JWT_SECRETE
              value: "hello-234567890-!@#4567"
            - name: LLM_SERVICE_URL
              value: "http://todo-llm:5003"
          startupProbe:
            httpGet:
              path: /api/health
              port: 5001
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi


              
            

          
  