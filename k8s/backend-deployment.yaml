apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-backend

  template:
    metadata:
      labels:
        app: todo-backend

    spec:
      containers:
        - name: backend 
          image: k8s-todo-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
          env: 
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/todoapp"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
              
            

          
  