apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-llm

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-llm
  template:
    metadata:
      labels:
        app: todo-llm
    spec:
      containers:
        - name: llm
          image: k8s-todo-llm:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: LLM_MODEL
              value: "gemma4:31b-cloud"
            - name: OLLAMA_HOST
              value: "http://host.minikube.internal:11434"


---
apiVersion: v1
kind: Service
metadata:
  name: todo-llm

spec:
  selector:
    app: todo-llm
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP