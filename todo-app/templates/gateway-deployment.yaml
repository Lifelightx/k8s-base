apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-gateway

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-gateway

  template:
    metadata:
      labels:
        app: todo-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: AUTH_SERVICE_URL
            - name: BACKEND_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: BACKEND_SERVICE_URL
            - name: LLM_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: LLM_SERVICE_URL
            - name: ALLOW_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: ALLOW_ORIGIN
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: REDIS_URL
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
                  


---
apiVersion: v1
kind: Service
metadata:
  name: todo-gateway
spec:
  selector:
    app: todo-gateway
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

