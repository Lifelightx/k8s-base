apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-llm

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-llm
  template:
    metadata:
      labels:
        app: todo-llm
    spec:
      containers:
        - name: llm
          image: {{ .Values.llm.image.repository }}:{{ .Values.llm.image.tag }}
          imagePullPolicy: {{ .Values.llm.image.pullPolicy }}
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: LLM_MODEL
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: OLLAMA_HOST
          startupProbe:
            httpGet:
              path: /health
              port: 5003
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi


---
apiVersion: v1
kind: Service
metadata:
  name: todo-llm
  labels:
    app: todo-llm

spec:
  selector:
    app: todo-llm
  ports:
    - name: http
      port: 5003
      targetPort: 5003
  type: ClusterIP