apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-llm

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-llm
  template:
    metadata:
      labels:
        app: todo-llm
    spec:
      containers:
        - name: llm
          image: {{ .Values.llm.image.repository }}:{{ .Values.llm.image.tag }}
          imagePullPolicy: {{ .Values.llm.image.pullPolicy }}
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: LLM_MODEL
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: OLLAMA_HOST


---
apiVersion: v1
kind: Service
metadata:
  name: todo-llm

spec:
  selector:
    app: todo-llm
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP